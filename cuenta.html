<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Telly</title>
    <link href="https://fonts.googleapis.com/css2?family=Coiny&family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #2E3F55;
            --accent-blue: #C6D9E4;
            --card-blue: #4F7C8C;
            --text-light: #F1ECE6;
            --font-title: 'Coiny', cursive;
            --font-body: 'Comfortaa', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--text-light);
            color: var(--bg-dark);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: var(--font-title);
            font-weight: normal;
        }

        /* --- Navbar --- */
        nav {
            background-color: var(--bg-dark);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 25px;
            font-weight: 700;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-blue);
        }

        .btn-nav {
            background-color: var(--accent-blue);
            color: var(--bg-dark) !important;
            padding: 10px 24px;
            border-radius: 20px;
            font-family: var(--font-title);
            font-size: 16px;
            transition: transform 0.2s;
        }

        .btn-nav:hover {
            transform: scale(1.05);
        }

        /* --- Account Layout --- */
        .account-wrapper {
            flex-grow: 1;
            display: flex;
            background-color: var(--text-light);
        }

        .account-image-side {
            flex: 1;
            display: none; /* Oculto en móviles */
            position: relative;
        }

        .account-image-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Capa de color semitransparente para unificar con la marca */
        .image-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(46, 63, 85, 0.2), rgba(46, 63, 85, 0.6));
        }

        .account-form-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            background-color: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(46, 63, 85, 0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .login-card h2 {
            color: var(--bg-dark);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .login-card p {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            color: var(--bg-dark);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 1rem;
            transition: border-color 0.3s;
            background-color: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--card-blue);
            background-color: white;
        }

        .btn-login {
            width: 100%;
            background-color: var(--bg-dark);
            color: var(--text-light);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-family: var(--font-title);
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-login:hover {
            background-color: var(--card-blue);
            transform: translateY(-2px);
        }

        .login-links {
            margin-top: 20px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .login-links a {
            color: var(--card-blue);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        .login-links a:hover {
            color: var(--bg-dark);
        }

        /* --- Footer --- */
        footer {
            background-color: var(--bg-dark);
            color: var(--text-light);
            text-align: center;
            padding: 40px 5%;
            font-size: 0.9rem;
            border-top: 1px solid rgba(241, 236, 230, 0.1);
        }

        /* Responsive */
        @media (min-width: 900px) {
            .account-image-side { display: block; }
        }
        @media (max-width: 768px) {
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <a href="index.html" class="logo-container">
            <img src="Imagenes/Isotipo Telly.png" alt="Isotipo Telly" style="object-fit: contain; width: 45px; height: 45px;" onerror="this.onerror=null; this.src='Imagenes/Isotipo Telly.jpeg';">
            <span style="font-family: var(--font-title); font-size: 24px; color: var(--text-light); letter-spacing: 2px;">TELLY</span>
        </a>
        
        <div class="nav-links">
            <a href="index.html#como-funciona">Cómo funciona</a>
            <a href="index.html#beneficios">Beneficios</a>
            <a href="equipo.html">Equipo</a>
            <a href="cuenta.html" style="color: var(--accent-blue);">Mi Cuenta</a>
            <a href="compra.html" class="btn-nav">Adquiere Telly</a>
        </div>
    </nav>

    <!-- Layout Dividido (Imagen Izquierda / Formulario Derecha) -->
    <div class="account-wrapper">
        
        <!-- Imagen Lifestyle -->
        <div class="account-image-side">
            <!-- Capa oscura sutil -->
            <div class="image-overlay"></div>
            <!-- Failsafe extensiones -->
            <img src="Imagenes/NIÑO_DORMIDO_TELLY.png" alt="Niño durmiendo relajado con Telly" onerror="this.onerror=function(){this.onerror=null; this.src='Imagenes/NIÑO_DORMIDO_TELLY.jpg';}; this.src='Imagenes/NIÑO_DORMIDO_TELLY.jpeg';">
        </div>

        <!-- Formulario de Login -->
        <div class="account-form-side">
            <div class="login-card">
                <h2>Bienvenido</h2>
                <p>Ingresa para administrar el descanso de tus pequeños.</p>
                
                <form action="panel.html" method="GET">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" placeholder="tu@correo.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    
                    <!-- Este botón simula el inicio de sesión y lleva al panel.html -->
                    <button type="submit" class="btn-login">Entrar</button>
                </form>

                <div class="login-links">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                    <a href="#">Crear cuenta</a>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <div style="margin-bottom: 20px;">
            <img src="Imagenes/Isotipo Telly.png" alt="Isotipo Telly" style="object-fit: contain; width: 30px; height: 30px; vertical-align: middle; margin-right: 10px;" onerror="this.onerror=null; this.src='Imagenes/Isotipo Telly.jpeg';">
            <span style="font-family: var(--font-title); font-size: 20px; letter-spacing: 1px; vertical-align: middle;">TELLY</span>
        </div>
        <p>Menos pantallas, más sueños.</p>
        <div style="margin-top: 20px;">
            <a href="equipo.html" style="color: var(--text-light); text-decoration: none; margin: 0 10px; font-size: 14px;">Equipo</a>
            <a href="compra.html" style="color: var(--text-light); text-decoration: none; margin: 0 10px; font-size: 14px;">Adquiere Telly</a>
        </div>
        <p style="margin-top: 20px; opacity: 0.6; font-size: 12px;">© 2026 Telly. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
